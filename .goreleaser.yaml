# .goreleaser.yaml
project_name: crate

before:
  hooks:
    - go mod tidy

builds:
  - id: crate-build
    main: ./cmd/crate/main.go
    binary: crate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    # use zip for windows
    # format_overrides:
    #   - goos: windows
    #     format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    # 将额外的文件包含进最终的压缩包中
    files:
      - specs
      - config.yaml
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

release:
  # 自动检测是否为 Pre-release (基于 tag 是否包含 -rc 等)
  prerelease: auto
  # 不要将当前 release 标记为 Latest (保持现有的 Latest 不变)
  # make_latest: false

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
