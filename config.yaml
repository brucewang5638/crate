# =========================================================
# Crate Configuration Example
# =========================================================

project_name: "my-project"
# dist_default: "el7"       # 默认发行版标识 (默认不填 会自动检测)
cache_dir: "~/.rpm_cache"   # 构建成功的 RPM 缓存路径
build_root: "~/rpmbuild"    # rpmbuild 的临时工作空间

# --- 发布包配置 ---
release:
  encrypt: false              # 是否加密打包 (使用 openssl aes-256-cbc)
  password: "changeme"        # 加密密码 (encrypt 为 true 时生效)

# --- 系统依赖 ---
# 在使用 -release 时，会自动通过 repotrack/dnf 下载这些包及其依赖到仓库中
system_deps:
  - "nginx"
  - "mariadb-server"
  - "redis"
  - "java-1.8.0-openjdk"

# --- 分组定义 ---
# 允许通过 -build infra 一次性构建多个构建块
groups:
  infra: ["redis", "mysql", "nginx"]
  backend: ["api-server", "worker"]
  all_services: ["example", "api-server"]

# --- 构建块定义 ---
components:
  - name: "example"                   # 构建块唯一标识 (comp_name)
    version: "1.0.0"                  # 版本号
    type: "service"                   # 类型 (仅做标记，暂不影响构建逻辑)
    spec: "specs/example.spec"        # SPEC 文件路径
    source_dir: "/home/user/code/src" # 源码绝对路径
    excludes: ["logs", "tmp"]         # 排除的文件/目录模式 (如 "*.log", "tmp/")

    # [标签] 可用于灵活筛选，例如 -build infra
    tags: ["demo", "example"]

    # [可选] 预构建验证
    # 构建前检查这些文件是否存在 (相对 source_dir)
    validate_exists:
      - "Makefile"
      - "README.md"

    # [可选] 预构建脚本
    # 在 source_dir 下执行的 Shell 命令 (如清理, 编译前端资源等)
    pre_build: "echo 'Pre-building example...' && make clean"
